[theme]
primaryColor = "#5636D3"
backgroundColor = "#F8F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#080C35"
font = "sans serif"
greenColor = "#28C76F"
orangeColor = "#E67835"
yellowColor = "#F2B84B"
redColor = "#D95C59"
blueColor = "#1660BC"
violetColor = "#5636D3"
grayColor = "#596076"
chartCategoricalColors = ["#5636D3", "#1660BC", "#E67835", "#D95C59", "#3B9472", "#B6AFE4"]
dataframeBorderColor = "#E4DDF6"
dataframeHeaderBackgroundColor = "#F3F0FF"
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true

[browser]
gatherUsageStats = false

[server]
headless = true
# Transformers exposes optional vision modules lazily. Disabling source watching
# prevents Streamlit from importing those unrelated modules during path scans.
fileWatcherType = "none"
